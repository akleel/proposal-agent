name: proposal-agent

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: proposal-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proposal_agent
      POSTGRES_PASSWORD: proposal_agent_local
      POSTGRES_DB: proposal_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - proposal_agent_postgres_data:/var/lib/postgresql
      - ./packages/db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proposal_agent -d proposal_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  proposal_agent_postgres_data:

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: proposal_agent
          POSTGRES_PASSWORD: proposal_agent_local
          POSTGRES_DB: proposal_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proposal_agent -d proposal_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://proposal_agent:proposal_agent_local@127.0.0.1:5432/proposal_agent
      TEST_DATABASE_URL: postgresql://proposal_agent:proposal_agent_local@127.0.0.1:5432/proposal_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate database
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build
